# Productivity-focused tmux defaults.
# Config path: ~/.config/tmux/tmux.conf

##### Core behavior
# Use Ctrl-a as prefix. It is easier to reach than Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Faster command response.
set -sg escape-time 10
set -g repeat-time 600

# Start windows and panes at 1, matching most editor/tab muscle memory.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep more scrollback.
set -g history-limit 50000

# Enable mouse selection, resizing, pane focus, and scrolling.
set -g mouse on

# True color support for modern terminals.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB"

# Let panes react to focus changes (needed for vim/nvim autoread, some plugins).
set -g focus-events on

# Keep pane sizes sane when clients of different sizes attach to the same session.
setw -g aggressive-resize on

# Don't let running programs rename windows out from under you.
setw -g allow-rename off

# Give status/reload messages enough time to actually read them.
set -g display-time 3000
set -g display-panes-time 3000

# If the current session is killed, land on another session instead of detaching.
set -g detach-on-destroy off

# Open new panes/windows in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload config quickly.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

##### Navigation
# Vim-style pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Move between windows with prefix + Ctrl-h/l.
bind C-h previous-window
bind C-l next-window

# Quick window selection.
bind Space last-window

##### Copy mode
setw -g mode-keys vi
set -g status-keys vi

# Enter copy mode with prefix + [.
bind [ copy-mode

# Vim-like selection and copying.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# System clipboard integration: macOS, then Wayland/X11 fallbacks for Linux boxes.
if-shell 'command -v pbcopy >/dev/null 2>&1' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'
}
if-shell 'command -v wl-copy >/dev/null 2>&1' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'
}
if-shell 'command -v xclip >/dev/null 2>&1' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard'
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard'
}

##### Layout helpers
# Split with intuitive keys too.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Toggle pane zoom.
bind z resize-pane -Z

# Kill pane/window without an extra confirmation prompt.
bind x kill-pane
bind X kill-window

# Floating scratch terminal, detached from your window layout (tmux >= 3.2).
bind g display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"

##### Status line
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour236,fg=colour250"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W* "
set -g window-status-current-style "bg=colour33,fg=colour231,bold"
set -g status-left-length 40
set -g status-left " #[fg=colour81,bold]#S #[fg=colour245]| "
set -g status-right-length 100
set -g status-right " #[fg=colour245]#(whoami)@#H #[fg=colour245]| #[fg=colour81]%Y-%m-%d %H:%M "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour33"

# Flag background window activity visually instead of an audible bell.
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none

##### Quality-of-life bindings
# List sessions and switch interactively.
bind s choose-tree -s

# Rename window/session.
bind , command-prompt -I "#W" "rename-window '%%'"
bind $ command-prompt -I "#S" "rename-session '%%'"

# Prompt to create or attach to a session.
bind S command-prompt -p "session name" "new-session -A -s '%%'"